<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f97316"><title>Nova senha • Mundo Flix</title><style>body{margin:0;font-family:system-ui;background:#0f172a;color:#111827;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:white;border-radius:20px;padding:26px}h1{margin:0 0 8px}.sub{color:#6b7280;font-size:14px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}input{border:1px solid #e5e7eb;margin:8px 0}button{border:0;background:#f97316;color:white;font-weight:800;cursor:pointer;margin-top:8px}.msg{margin-top:12px;font-size:14px}a{color:#f97316;text-decoration:none;font-weight:700}</style></head><body><main class="box"><h1>Criar nova senha</h1><p class="sub">Digite uma nova senha para sua conta do Mundo Flix.</p><input id="p1" type="password" autocomplete="new-password" placeholder="Nova senha"><input id="p2" type="password" autocomplete="new-password" placeholder="Repita a nova senha"><button id="save">Salvar nova senha</button><div id="msg" class="msg"></div><p><a href="/">Voltar para entrar</a></p></main><script src="config.js"></script><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=window.MUNDO_FLIX_CONFIG;const msg=document.getElementById('msg');if(!cfg?.supabaseUrl||!cfg?.supabaseKey){msg.textContent='A configuração do servidor ainda não foi publicada.';}else{const sb=createClient(cfg.supabaseUrl,cfg.supabaseKey);document.getElementById('save').onclick=async()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<8){msg.textContent='Use uma senha com pelo menos 8 caracteres.';return}if(a!==b){msg.textContent='As senhas não coincidem.';return}msg.textContent='Salvando...';const{error}=await sb.auth.updateUser({password:a});if(error){msg.textContent='Não foi possível atualizar a senha. Abra novamente o link recebido por e-mail.';return}msg.textContent='Senha atualizada com sucesso. Você já pode voltar e entrar.';};}</script></body></html>
