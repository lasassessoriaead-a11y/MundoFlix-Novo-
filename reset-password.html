<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f97316"><title>Recuperar senha • Mundo Flix</title><style>body{margin:0;font-family:system-ui;background:#0f172a;color:#111827;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:white;border-radius:20px;padding:26px}h1{margin:0 0 8px}.sub{color:#6b7280;font-size:14px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}input{border:1px solid #e5e7eb;margin:12px 0}button{border:0;background:#f97316;color:white;font-weight:800;cursor:pointer}.msg{margin-top:12px;font-size:14px}a{color:#f97316;text-decoration:none;font-weight:700}</style></head><body><main class="box"><h1>Recuperar senha</h1><p class="sub">Informe o e-mail da sua conta do Mundo Flix. Enviaremos um link seguro para criar uma nova senha.</p><input id="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com"><button id="send">Enviar link de recuperação</button><div id="msg" class="msg"></div><p><a href="/">Voltar para entrar</a></p></main><script src="config.js"></script><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=window.MUNDO_FLIX_CONFIG;const msg=document.getElementById('msg');if(!cfg?.supabaseUrl||!cfg?.supabaseKey){msg.textContent='A configuração do servidor ainda não foi publicada.';}else{const sb=createClient(cfg.supabaseUrl,cfg.supabaseKey);document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){msg.textContent='Informe seu e-mail.';return}msg.textContent='Enviando...';const redirectTo=new URL('/update-password.html',location.origin).href;const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});msg.textContent=error?'Não foi possível enviar o link. Tente novamente.':'Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.';};}</script></body></html>
